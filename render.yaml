services:
  # FastAPI backend
  - type: web
    name: reelist-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TMDB_API_KEY
        sync: false          # set the real value in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: "*"           # tighten to your frontend's URL after first deploy
    healthCheckPath: /health

  # Static frontend
  - type: web
    name: reelist-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
